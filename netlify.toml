# netlify.toml — Road Ready JA

# ── Functions ──────────────────────────────────────────────────────────────────
[functions]
  directory = "netlify/functions"

# ── Redirects ─────────────────────────────────────────────────────────────────
# Static asset pass-throughs MUST come before the SPA catch-all.
# Without these, some Netlify edge nodes serve index.html for .js/.css files,
# causing "MIME type is text/html" errors in Firefox and Safari.

[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

[[redirects]]
  from = "/pages/*"
  to = "/pages/:splat"
  status = 200

[[redirects]]
  from = "/netlify/functions/*"
  to = "/netlify/functions/:splat"
  status = 200

# SPA catch-all — MUST be last. Only fires when no real file matched above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/public/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/public/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/public/components/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# HTML — always revalidate so deploys are seen immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
