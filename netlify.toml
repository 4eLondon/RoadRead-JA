# netlify.toml — Road Ready JA

# ── SPA redirect ──────────────────────────────────────────────────────────────
# IMPORTANT: This must stay. It catches unknown routes and serves index.html
# so client-side navigation works. Netlify evaluates [[headers]] before
# [[redirects]], so static files are served correctly before this fires.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

# ── Cache headers ─────────────────────────────────────────────────────────────
# Netlify serves real files first, so these headers apply to actual assets.
# The /* redirect above only fires for paths with no matching file on disk.

[[headers]]
  for = "/public/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/public/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/public/components/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# HTML pages — always revalidate so deploys are seen immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
