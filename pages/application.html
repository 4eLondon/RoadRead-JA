<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Ready JA – Applications</title>
  <link rel="icon" type="image/png" href="/assets/favicon-32x32.png">
  <link rel="stylesheet" href="/public/css/variables.css" />
  <link rel="stylesheet" href="/public/css/dotnav.css" />
  <link rel="stylesheet" href="/public/css/form.css" />
</head>

<body>
  <!-- ── Top dot navigation ── -->
  <nav class="dot-nav">
    <div class="dot-nav__item">
      <a class="dot-nav__dot" href="/"></a>
      <span class="dot-nav__label">Home</span>
    </div>
    <div class="dot-nav__item">
      <a class="dot-nav__dot" href="/#about"></a>
      <span class="dot-nav__label">About Us</span>
    </div>
    <div class="dot-nav__item">
      <a class="dot-nav__dot" href="/#contact"></a>
      <span class="dot-nav__label">Contact</span>
    </div>

    <button id="theme-toggle" class="theme-toggle" aria-label="Switch to light mode">
    </button>

  </nav>

  <!-- Top bar -->
  <nav class="topbar">
    <img src="/public/images/logo.png" style="width: 160px; height: auto" />
  </nav>

  <!-- Page wrapper -->
  <div class="page">
    <div class="form-card">
      <!-- Card header -->
      <div class="card-head">
        <span class="eyebrow">Membership</span>
        <h1 class="page-title" id="page-title">New Application</h1>
        <div class="tab-group">
          <button class="tab active" id="tab-apply" onclick="switchTab('apply')">
            Apply
          </button>
          <button class="tab" id="tab-renew" onclick="switchTab('renew')">
            Renew / Replace
          </button>
        </div>

      </div>

      <!-- Card body -->
      <div class="card-body">
        <!-- Success panel (shared) -->
        <div class="success hidden" id="success-panel">
          <div class="success__icon">✓</div>
          <h2 class="success__title" id="success-title">Submitted</h2>
          <p class="success__sub">Your reference IDs have been generated.</p>
          <div class="success__ids">
            <div class="id-row">
              <span class="id-label">Application ID</span>
              <span class="id-val" id="out-app-id">—</span>
            </div>
            <div class="id-row">
              <span class="id-label">User ID</span>
              <span class="id-val" id="out-user-id">—</span>
            </div>
          </div>
          <a class="btn-submit" href="/pages/dashboard.html" style="text-decoration: none; margin-top: 1rem">
            Back to Dashboard
          </a>
        </div>

        <!-- ── APPLY FORM ── -->
        <form class="form-panel" id="form-apply" novalidate>

          <!-- Role selector -->
          <div class="role-grid">
            <label class="role-card selected" id="card-citizen" for="role-citizen">
              <input type="radio" name="apply-role" id="role-citizen" value="citizen" checked />
              <span class="role-name">Citizen</span>
              <span class="role-desc">Apply for a new driver's licence</span>
            </label>
            <label class="role-card" id="card-official" for="role-official">
              <input type="radio" name="apply-role" id="role-official" value="official" />
              <span class="role-name">Official</span>
              <span class="role-desc">Police, government or licensing authority</span>
            </label>
          </div>

          <!-- Citizen fields (shown by default) -->
          <div id="citizen-fields">
            <div class="frow">
              <div class="fgroup">
                <label class="flabel" for="a-name">Full Name</label>
                <input class="finput" id="a-name" type="text" placeholder="Jane Doe" />
                <span class="ferror" id="err-a-name"></span>
              </div>
            </div>
            <div class="frow pair">
              <div class="fgroup">
                <label class="flabel" for="a-email">Email</label>
                <input class="finput" id="a-email" type="email" placeholder="jane@example.com" />
                <span class="ferror" id="err-a-email"></span>
              </div>
              <div class="fgroup">
                <label class="flabel" for="a-trn">TRN</label>
                <input class="finput" id="a-trn" type="text" placeholder="000-000-000" maxlength="11" />
                <span class="ferror" id="err-a-trn"></span>
              </div>
            </div>
            <div class="frow pair">
              <div class="fgroup">
                <label class="flabel" for="a-dob">Date of Birth</label>
                <input class="finput" id="a-dob" type="date" />
                <span class="ferror" id="err-a-dob"></span>
              </div>
              <div class="fgroup">
                <label class="flabel" for="a-phone">Phone</label>
                <input class="finput" id="a-phone" type="tel" placeholder="876-000-0000" maxlength="12" />
                <span class="ferror" id="err-a-phone"></span>
              </div>
            </div>
            <div class="frow pair">
              <div class="fgroup">
                <label class="flabel" for="a-pass">Password</label>
                <input class="finput" id="a-pass" type="password" placeholder="Min. 8 characters" />
                <div class="strength-bar">
                  <div class="strength-seg" id="a-seg-1"></div>
                  <div class="strength-seg" id="a-seg-2"></div>
                  <div class="strength-seg" id="a-seg-3"></div>
                  <div class="strength-seg" id="a-seg-4"></div>
                </div>
                <span class="strength-label" id="a-strength-label"></span>
                <span class="ferror" id="err-a-pass"></span>
              </div>
              <div class="fgroup">
                <label class="flabel" for="a-confirm">Confirm Password</label>
                <input class="finput" id="a-confirm" type="password" placeholder="Repeat password" />
                <span class="ferror" id="err-a-confirm"></span>
              </div>
            </div>
          </div>

          <!-- Official fields (hidden until role = official) -->
          <div id="official-fields" class="hidden">
            <div class="frow">
              <div class="fgroup">
                <label class="flabel" for="o-name">Full Name</label>
                <input class="finput" id="o-name" type="text" placeholder="Jane Doe" />
                <span class="ferror" id="err-o-name"></span>
              </div>
            </div>
            <div class="frow pair">
              <div class="fgroup">
                <label class="flabel" for="o-email">Email</label>
                <input class="finput" id="o-email" type="email" placeholder="jane@example.com" />
                <span class="ferror" id="err-o-email"></span>
              </div>
              <div class="fgroup">
                <label class="flabel" for="o-trn">TRN</label>
                <input class="finput" id="o-trn" type="text" placeholder="000-000-000" maxlength="11" />
                <span class="ferror" id="err-o-trn"></span>
              </div>
            </div>
            <div class="frow pair">
              <div class="fgroup">
                <label class="flabel" for="o-org">Organisation</label>
                <select class="fselect" id="o-org">
                  <option value="" disabled selected>Select agency</option>
                  <option value="jcf">Jamaica Constabulary Force</option>
                  <option value="tax_admin">Tax Administration Jamaica</option>
                  <option value="licensing">Licensing Authority</option>
                  <option value="transport">Ministry of Transport</option>
                  <option value="customs">Jamaica Customs Agency</option>
                  <option value="other">Other Government Body</option>
                </select>
                <span class="ferror" id="err-o-org"></span>
              </div>
              <div class="fgroup">
                <label class="flabel" for="o-rank">Rank / Title</label>
                <input class="finput" id="o-rank" type="text" placeholder="e.g. Sergeant" />
                <span class="ferror" id="err-o-rank"></span>
              </div>
            </div>
            <div class="frow pair">
              <div class="fgroup">
                <label class="flabel" for="o-badge">Badge / Staff ID</label>
                <input class="finput" id="o-badge" type="text" placeholder="ID-000000" />
                <span class="ferror" id="err-o-badge"></span>
              </div>
              <div class="fgroup">
                <label class="flabel" for="o-dept">Department / Station</label>
                <input class="finput" id="o-dept" type="text" placeholder="e.g. Half Way Tree" />
                <span class="ferror" id="err-o-dept"></span>
              </div>
            </div>
            <div class="frow">
              <div class="fgroup">
                <label class="flabel" for="o-auth-code">Authorization Code</label>
                <input class="finput" id="o-auth-code" type="text" placeholder="Provided by your supervisor" />
                <span class="ferror" id="err-o-auth-code"></span>
              </div>
            </div>
            <div class="frow pair">
              <div class="fgroup">
                <label class="flabel" for="o-pass">Password</label>
                <input class="finput" id="o-pass" type="password" placeholder="Min. 8 characters" />
                <div class="strength-bar">
                  <div class="strength-seg" id="o-seg-1"></div>
                  <div class="strength-seg" id="o-seg-2"></div>
                  <div class="strength-seg" id="o-seg-3"></div>
                  <div class="strength-seg" id="o-seg-4"></div>
                </div>
                <span class="strength-label" id="o-strength-label"></span>
                <span class="ferror" id="err-o-pass"></span>
              </div>
              <div class="fgroup">
                <label class="flabel" for="o-confirm">Confirm Password</label>
                <input class="finput" id="o-confirm" type="password" placeholder="Repeat password" />
                <span class="ferror" id="err-o-confirm"></span>
              </div>
            </div>
            <div class="official-note">
              Official accounts require supervisor verification before full access is granted. You will receive an email once approved.
            </div>
          </div>

          <button class="btn-submit" type="submit" id="apply-btn">
            Submit Application
          </button>
        </form>

        <!-- ── RENEW FORM ── -->
        <form class="form-panel hidden" id="form-renew" novalidate>
          <div class="frow">
            <div class="fgroup">
              <label class="flabel" for="r-name">Full Name</label>
              <input class="finput" id="r-name" type="text" placeholder="Jane Doe" />
              <span class="ferror" id="err-r-name"></span>
            </div>
          </div>

          <div class="frow pair">
            <div class="fgroup">
              <label class="flabel" for="r-trn">TRN</label>
              <input class="finput" id="r-trn" type="text" placeholder="000-000-000" maxlength="11" />
              <span class="ferror" id="err-r-trn"></span>
            </div>
            <div class="fgroup">
              <label class="flabel" for="r-licence">Licence Number</label>
              <input class="finput" id="r-licence" type="text" placeholder="L000-00000" />
              <span class="ferror" id="err-r-licence"></span>
            </div>
          </div>

          <div class="frow pair">
            <div class="fgroup">
              <label class="flabel" for="r-issue">Issue Date</label>
              <input class="finput" id="r-issue" type="date" />
              <span class="ferror" id="err-r-issue"></span>
            </div>
            <div class="fgroup">
              <label class="flabel" for="r-expiry">Expiry Date</label>
              <input class="finput" id="r-expiry" type="date" />
              <span class="ferror" id="err-r-expiry"></span>
            </div>
          </div>

          <div class="frow">
            <div class="fgroup">
              <label class="flabel" for="r-status">Status</label>
              <select class="fselect" id="r-status">
                <option value="" disabled selected>Select status</option>
                <option value="active">Active</option>
                <option value="expired">Expired</option>
                <option value="suspended">Suspended</option>
                <option value="lost">Lost</option>
                <option value="damaged">Damaged</option>
              </select>
              <span class="ferror" id="err-r-status"></span>
            </div>
          </div>

          <div class="frow pair">
            <div class="fgroup">
              <label class="flabel" for="r-payment">Payment Method</label>
              <select class="fselect" id="r-payment">
                <option value="" disabled selected>Select method</option>
                <option value="card">Credit / Debit Card</option>
                <option value="bank">Bank Transfer</option>
                <option value="cash">Cash</option>
              </select>
              <span class="ferror" id="err-r-payment"></span>
            </div>
            <div class="fgroup">
              <label class="flabel" for="r-amount">Amount (JMD)</label>
              <input class="finput" id="r-amount" type="number" placeholder="0.00" min="0" step="0.01" />
              <span class="ferror" id="err-r-amount"></span>
            </div>
          </div>

          <div class="frow">
            <div class="fgroup">
              <label class="flabel">Upload Document</label>
              <label class="file-drop" id="file-drop">
                <input type="file" id="r-file" accept=".pdf,.jpg,.jpeg,.png" />
                <span class="file-drop__text" id="file-label">
                  Click to upload or drag &amp; drop — PDF, JPG, PNG
                </span>
              </label>
              <span class="ferror" id="err-r-file"></span>
            </div>
          </div>

          <button class="btn-submit" type="submit" id="renew-btn">
            Submit Renewal
          </button>
        </form>
      </div>
      <!-- /card-body -->
    </div>
    <!-- /form-card -->
  </div>
  <!-- /page -->

  <div id="toast" class="toast"></div>

  <script src="/public/js/theme.js"></script>

  <!-- Role toggle: runs immediately, no module dependency needed -->
  <script>
    // Tab switcher (needed globally for onclick= in HTML)
    window.switchTab = function(type) {
      const isRenew = type === 'renew';
      const outPanel = document.getElementById(isRenew ? 'form-apply' : 'form-renew');
      const inPanel  = document.getElementById(isRenew ? 'form-renew' : 'form-apply');

      document.getElementById('tab-apply').classList.toggle('active', !isRenew);
      document.getElementById('tab-renew').classList.toggle('active', isRenew);
      document.getElementById('page-title').textContent = isRenew ? 'Renew / Replace' : 'New Application';
      document.getElementById('success-panel').classList.add('hidden');

      if (outPanel.classList.contains('hidden')) {
        inPanel.classList.remove('hidden');
        return;
      }
      outPanel.classList.add('hiding');
      outPanel.addEventListener('animationend', () => {
        outPanel.classList.add('hidden');
        outPanel.classList.remove('hiding');
        inPanel.classList.remove('hidden');
      }, { once: true });
    };

    // Role toggle for apply form
    function updateApplyRole() {
      const isOfficial = document.querySelector('input[name="apply-role"]:checked')?.value === 'official';
      document.getElementById('card-citizen').classList.toggle('selected', !isOfficial);
      document.getElementById('card-official').classList.toggle('selected', isOfficial);
      document.getElementById('citizen-fields').classList.toggle('hidden', isOfficial);
      document.getElementById('official-fields').classList.toggle('hidden', !isOfficial);
      document.getElementById('apply-btn').textContent = isOfficial
        ? 'Request Official Account'
        : 'Submit Application';
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Wire up radio buttons
      document.querySelectorAll('input[name="apply-role"]').forEach(function(r) {
        r.addEventListener('change', updateApplyRole);
      });

      // Wire up card clicks
      ['card-citizen', 'card-official'].forEach(function(id) {
        var card = document.getElementById(id);
        card && card.addEventListener('click', function() {
          var radio = card.querySelector('input[type="radio"]');
          if (radio) { radio.checked = true; updateApplyRole(); }
        });
      });

      // Run once on load to ensure correct initial state
      updateApplyRole();

      // URL param: /apply?type=renew
      var urlType = new URLSearchParams(window.location.search).get('type');
      if (urlType === 'renew') switchTab('renew');
    });
  </script>

  <script type="module" src="/public/js/form.js"></script>
</body>

</html>
